name: Build Dexor for Windows

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/prepare-publish.mjs
      - run: npm run package:win
      - run: npm run package:portable:zip
      - shell: pwsh
        run: Copy-Item release/Dexor-Setup-*.exe release/Dexor-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Dexor-Setup-*.exe
            release/Dexor-Setup.exe
            release/Dexor-Portable.zip
          generate_release_notes: true
